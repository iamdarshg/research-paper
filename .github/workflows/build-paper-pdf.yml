name: Build paper PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper-pdf.yml'
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper-pdf.yml'
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          args: >-
            -pdf
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -shell-escape

      - name: Rename PDF artifact
        working-directory: paper
        run: |
          cp main.pdf research-paper.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-paper-pdf
          path: paper/research-paper.pdf
          if-no-files-found: error
