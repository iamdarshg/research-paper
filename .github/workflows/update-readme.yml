name: Global config and README capacity report

permissions:
  contents: write   # grants push access to github-actions[bot]
  
"on":
  workflow_dispatch:
  push:
  pull_request:

jobs:
  capacity-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install report dependencies
        run: pip install torch numpy scipy scikit-image trimesh pyyaml tqdm click tensorboard

      - name: Regenerate capacity report
        run: python CLI/update_model_capacity_report.py

      - name: Verify pull request report
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- README.md

      - name: Commit Results
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update model capacity report [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
