# 128^3 / 85M-param training run protocol
# Target GPU: L4 spot on GCP ($0.70/hr)
# Corpus: 8,027 shapes (grounded_combined + perturbed + procedural)

train:
  enabled: true
  num_epochs: 12
  batch_size: 1
  learning_rate: 0.0002
  latent_dim: 512
  grid_size: 128
  precision: bfloat16
  disconnection_penalty: 30.0
  save_dir: ../../checkpoints_128_85m
  run_class: scaling_128_85m
  solver: D3Q27
  dataset_manifest: ../../build/final_combined_corpus_20260824/combined_training_manifest.jsonl
  enable_consistency: false  # deferred to phase 2
  enable_pipeline: false
  enable_checkpointing: true
  enable_compile: true
  direct_solver_interval: 4
  require_direct_solver_every_iteration: false
  checkpoint_every_updates: 25

smoke:
  enabled: true
  stop_after_updates: 5
  checkpoint_every_updates: 1