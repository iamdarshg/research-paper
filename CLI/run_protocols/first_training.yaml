reference_evidence:
  enabled: true
  output_root: ../../build/first_training
  sample_count: 20
  protocol: first_training.yaml
  output: ../../build/first_training/reference_evidence_bundle.json

validate_manifest:
  enabled: true
  manifest: ../../build/first_training/grounded_corpus/manifest.jsonl
  level: claim-bearing
  output: ../../build/first_training/manifest_validation.json

train:
  enabled: true
  num_epochs: 1
  batch_size: 1
  learning_rate: 0.0002
  latent_dim: 16
  precision: float32
  disconnection_penalty: 30.0
  num_samples: 20
  save_dir: ../../checkpoints_first_training
  run_class: final
  solver: D3Q27
  dataset_manifest: ../../build/first_training/grounded_corpus/manifest.jsonl
  baseline_config: ../../build/first_training/baseline_config.json
  claim_gates: ../../paper/FINAL_RUN_GATES.md
  enable_consistency: true
  enable_pipeline: false
  enable_checkpointing: true
  enable_compile: false

run_metadata:
  enabled: true
  checkpoint: ../../checkpoints_first_training/final_optimized_model.pt
  manifest: ../../build/first_training/grounded_corpus/manifest.jsonl
  protocol: first_training.yaml
  output: ../../build/first_training/run_metadata.json
  run_id_prefix: first-training

evaluate_baselines:
  enabled: false

validate_conditions:
  enabled: false

condition_benchmark:
  enabled: true
  checkpoint: ../../checkpoints_first_training/final_optimized_model.pt
  manifest: ../../build/first_training/grounded_corpus/manifest.jsonl
  num_seeds: 8
  min_grounded_records: 20
  output: ../../build/first_training/condition_benchmark.json

manufacturing_constraints:
  enabled: true
  manifest: ../../build/first_training/grounded_corpus/manifest.jsonl
  output: ../../build/first_training/manufacturing_constraints.json

aircraft_validity:
  enabled: true
  input_dir: ../../build/first_training/grounded_corpus/generated_voxels
  output: ../../build/first_training/aircraft_validity.json

multi_seed_eval:
  enabled: false

baseline_statistics:
  enabled: true
  baseline_config: ../../build/first_training/baseline_config.json
  records_json: ../../build/first_training/baseline_records.json
  metric_keys:
    - lift_to_drag
  min_seeds: 3
  output: ../../build/first_training/baseline_statistics.json

final_evidence:
  enabled: true
  baseline_statistics: ../../build/first_training/baseline_statistics.json
  require_run_consistency: true
  run_metadata: ../../build/first_training/run_metadata.json
  output: ../../build/first_training/final_evidence_package.json

gate_readiness:
  enabled: true
  final_evidence: ../../build/first_training/final_evidence_package.json
  output: ../../build/first_training/gate_readiness.json
