reference_evidence:
  enabled: true
  output_root: ../../build/protocol_final
  sample_count: 20
  protocol: final_cloud.yaml
  output: ../../build/protocol_final/reference_evidence_bundle.json

validate_manifest:
  enabled: true
  manifest: ../../build/protocol_final/grounded_corpus/manifest.jsonl
  level: claim-bearing
  output: ../../build/protocol_final/manifest_validation.json

train:
  enabled: false
  num_epochs: 5
  batch_size: 1
  learning_rate: 0.0002
  latent_dim: 16
  precision: float32
  disconnection_penalty: 30.0
  save_dir: ../../checkpoints_protocol_final
  run_class: final
  solver: D3Q27
  dataset_manifest: ../../docs/dataset/minimal_grounded_manifest.jsonl
  baseline_config: ../baseline_config.yaml
  claim_gates: ../../paper/FINAL_RUN_GATES.md
  enable_consistency: true
  enable_pipeline: true
  enable_checkpointing: true
  enable_compile: false

evaluate_baselines:
  enabled: false
  solver: D3Q27
  grid_size: 32
  steps: 500
  output: ../../build/protocol_final/baseline_report.json

validate_conditions:
  enabled: false
  num_seeds: 8
  grid_size: 32
  output: ../../build/protocol_final/condition_validation.json

condition_benchmark:
  enabled: true
  manifest: ../../build/protocol_final/grounded_corpus/manifest.jsonl
  checkpoint: ../../build/protocol_final/reference_checkpoint.json
  num_seeds: 8
  min_grounded_records: 20
  output: ../../build/protocol_final/condition_benchmark.json

manufacturing_constraints:
  enabled: true
  manifest: ../../build/protocol_final/grounded_corpus/manifest.jsonl
  output: ../../build/protocol_final/manufacturing_constraints.json

aircraft_validity:
  enabled: true
  input_dir: ../../build/protocol_final/grounded_corpus/generated_voxels
  output: ../../build/protocol_final/aircraft_validity.json

multi_seed_eval:
  enabled: false
  num_seeds: 8
  grid_size: 32
  output_dir: ../../build/protocol_final/multi_seed_eval

baseline_statistics:
  enabled: true
  baseline_config: ../../build/protocol_final/baseline_config.json
  records_json: ../../build/protocol_final/baseline_records.json
  metric_keys:
    - lift_to_drag
  min_seeds: 3
  output: ../../build/protocol_final/baseline_statistics.json

final_evidence:
  enabled: true
  baseline_statistics: ../../build/protocol_final/baseline_statistics.json
  require_run_consistency: true
  run_metadata: ../../build/protocol_final/run_metadata.json
  output: ../../build/protocol_final/final_evidence_package.json

gate_readiness:
  enabled: true
  final_evidence: ../../build/protocol_final/final_evidence_package.json
  output: ../../build/protocol_final/gate_readiness.json
