validate_manifest:
  enabled: true
  manifest: ../../build/faa_geometry_case_corpus_20260624/geometry_case_manifest_5k.jsonl
  level: claim-bearing
  output: ../../build/protocol_final/manifest_validation.json

train:
  enabled: true
  num_epochs: 5
  batch_size: 1
  learning_rate: 0.0002
  latent_dim: 16
  grid_size: 32
  precision: float32
  disconnection_penalty: 30.0
  save_dir: ../../checkpoints_protocol_final
  run_class: final
  solver: D3Q27
  dataset_manifest: ../../build/faa_geometry_case_corpus_20260624/geometry_case_manifest_5k.jsonl
  baseline_config: ../baseline_config.yaml
  claim_gates: ../../paper/FINAL_RUN_GATES.md
  enable_consistency: true
  enable_pipeline: false
  enable_checkpointing: true
  enable_compile: false

evaluate_baselines:
  enabled: true
  solver: D3Q27
  grid_size: 32
  steps: 500
  output: ../../build/protocol_final/baseline_report.json

validate_conditions:
  enabled: true
  num_seeds: 8
  grid_size: 32
  output: ../../build/protocol_final/condition_validation.json

condition_benchmark:
  enabled: true
  manifest: ../../build/faa_geometry_case_corpus_20260624/geometry_case_manifest_5k.jsonl
  num_seeds: 8
  min_grounded_records: 20
  output: ../../build/protocol_final/condition_benchmark.json

manufacturing_constraints:
  enabled: true
  manifest: ../../build/faa_geometry_case_corpus_20260624/geometry_case_manifest_5k.jsonl
  output: ../../build/protocol_final/manufacturing_constraints.json

prepare_aircraft_validity_inputs:
  enabled: true
  output_dir: ../../build/protocol_final/generated_voxels
  metadata: ../../build/protocol_final/generated_voxels_metadata.json
  num_samples: 20
  grid_size: 32
  seed_start: 0
  max_attempts: 64

aircraft_validity:
  enabled: true
  input_dir: ../../build/protocol_final/generated_voxels
  output: ../../build/protocol_final/aircraft_validity.json

multi_seed_eval:
  enabled: true
  num_seeds: 8
  grid_size: 32
  output_dir: ../../build/protocol_final/multi_seed_eval

final_evidence:
  enabled: true
  baseline_statistics: ../../build/protocol_final/baseline_statistics.json
  require_run_consistency: true
  output: ../../build/protocol_final/final_evidence_package.json
