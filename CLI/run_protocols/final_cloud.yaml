validate_manifest:
  enabled: true
  manifest: ../../docs/dataset/minimal_grounded_manifest.jsonl
  level: claim-bearing
  output: ../../build/protocol_final/manifest_validation.json

train:
  enabled: true
  num_epochs: 5
  batch_size: 1
  learning_rate: 0.0002
  latent_dim: 16
  precision: float32
  disconnection_penalty: 30.0
  save_dir: ../../checkpoints_protocol_final
  run_class: final
  solver: D3Q27
  dataset_manifest: ../../docs/dataset/minimal_grounded_manifest.jsonl
  baseline_config: ../baseline_config.yaml
  claim_gates: ../../paper/FINAL_RUN_GATES.md
  enable_consistency: true
  enable_pipeline: true
  enable_checkpointing: true
  enable_compile: false

evaluate_baselines:
  enabled: true
  solver: D3Q27
  grid_size: 32
  steps: 500
  output: ../../build/protocol_final/baseline_report.json

validate_conditions:
  enabled: true
  num_seeds: 8
  grid_size: 32
  output: ../../build/protocol_final/condition_validation.json

multi_seed_eval:
  enabled: true
  num_seeds: 8
  grid_size: 32
  output_dir: ../../build/protocol_final/multi_seed_eval
