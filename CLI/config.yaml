# Configuration Template for Aircraft Diffusion Model
# Copy this file and modify as needed, then load in your training script

model:
  latent_dim: 128
  xyz_dim: 3
  encoder_channels: [64, 128, 256]
  decoder_channels: [256, 128, 64]
  attention_heads: 8
  num_attention_layers: 4

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  sampling_timesteps: 250
  guidance_scale: 7.5

training:
  batch_size: 4
  learning_rate: 0.0002
  weight_decay: 0.0001
  num_epochs: 100
  warmup_steps: 1000
  gradient_clip: 1.0
  ema_decay: 0.999
  disconnection_penalty: 10.0
  use_mixed_precision: true
  save_interval: 5
  val_interval: 1

cfd:
  resolution: 32
  mach_number: 0.3
  reynolds_number: 1000000.0
  simulation_steps: 500
  output_interval: 50
  device_id: 0

# Experimental conditioning schema for the condition-vector seam.
# The detailed categorical vocabulary and scalar constraint layout now live in
# `conditioning_schema.yaml` so dataset generation, training, and offline
# densification all share the same source of truth.
conditioning:
  schema_path: conditioning_schema.yaml
  vector_dim: 22
  notes:
    - public CLI still only wires `target_speed` on the direct `generate` path
    - offline densification and synthetic dataset generation should use the full schema
    - scalar constraints now include thrust-to-weight, turn-rate, and explicit min/max bounds

design:
  target_speed: 50.0
  wingspan_limit_m: 1.8
  thrust_to_weight_min: 0.45
  turn_rate_min_deg_s: 18.0
  required_static_thrust_n: 180.0
  engine_diameter_mm: 140
  engine_length_mm: 260
  engine_count_min: 1
  engine_count_max: 2
  payload_mass_min_g: 500
  payload_mass_max_g: 2000
  takeoff_distance_min_m: 120
  takeoff_distance_max_m: 250
  wall_thickness_min_mm: 1
  wall_thickness_max_mm: 2
  part_count_min: 1
  part_count_max: 8
  manufacturing_method: fdm_pla_0p4mm
  space_weight: 0.33
  drag_weight: 0.33
  lift_weight: 0.34
  bounding_box: [64, 64, 64]

