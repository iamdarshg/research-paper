# Repository-wide experiment configuration.
#
# This is the single source of truth for default architecture, training,
# solver, and generated README capacity-report values. CLI flags may override
# a value for a one-off run, but changing this file changes the checked-in
# defaults used by the primary and monitored trainers.

schema_version: 1

model:
  latent_dim: 192
  # Structured corpus latents are normalized geometry/condition features.
  latent_value_min: 0.0
  latent_value_max: 1.0
  grid_resolution: 96
  xyz_dim: 3
  attention_groups: 8
  attention_kv_groups: 4
  num_attention_layers: 4
  coordinate_decoder_threshold: 96
  coordinate_chunk_size: 16384
  coordinate_fourier_bands: 6
  coordinate_gradient_checkpointing: true
  enable_gradient_checkpointing: true
  use_torch_compile: false
  # A1 (experiment/kernel-fusion-launch): compile the backward graph with
  # torch._dynamo.compiled_autograd (fuses checkpointed decoder recomputes +
  # elementwise backward ops). Opt-in, default off; parity-gated.
  compiled_autograd: false
  # P6c FUSION-1: scope torch.compile to the coordinate-decoder MLP only so
  # inductor fuses the post-GEMM add+SiLU epilogues into the GEMM kernels.
  # Opt-in, default off. Whole-model compile stays off (it previously overflowed).
  compile_converter_decoder: false

scaling:
  # This count selects the reported network widths. It is a capacity-planning
  # input, not a claim that these geometries ship in the repository.
  capacity_basis_unique_geometries: 500
  reference_unique_geometries: 600
  width_exponent: 0.20
  minimum_scale: 0.75
  maximum_scale: 1.75
  high_resolution_channel_base: 116
  high_resolution_channel_step: 48
  maximum_high_resolution_channel_base: 128
  high_resolution_decoder_width: 928
  maximum_high_resolution_decoder_width: 1024
  high_resolution_decoder_depth: 5
  high_resolution_decoder_depth_large_corpus: 5
  large_corpus_threshold: 4096

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  sampling_timesteps: 250
  guidance_scale: 7.5

training:
  batch_size: 1
  # Continuation from the preserved checkpoint uses a conservative LR. The
  # 2e-4 recovery probe moved diffusion weights 3.7% in 40 samples and failed
  # fixed-validation promotion despite reducing the measured solver loss.
  learning_rate: 0.00002
  lr_min_ratio: 0.10
  converter_learning_rate: 0.00002
  consistency_student_learning_rate: 0.00002
  # Distillation is sparse for cost, but its own counter cycles over all four
  # inference timesteps instead of repeatedly sampling unsupported levels.
  # Four sparse consistency updates in the 40-update stabilization probe cover
  # the complete [999, 666, 333, 0] inference schedule once.
  consistency_interval: 10
  consistency_loss_type: huber
  consistency_huber_delta: 1.0
  consistency_raw_mse_fail_threshold: 1000000.0
  consistency_timestep_sampling: inference_stratified
  # Per-branch trust regions are calibrated against the preserved checkpoint
  # before a long run. They limit extreme gradients but never amplify small ones.
  consistency_gradient_max_norm: 0.25
  student_data_gradient_max_norm: 1.0
  # The first 40-update probe found data/direct cosine < -0.9 on 11 updates.
  # Retain the measured branch while preventing it from canceling a unit data
  # branch during highly conflicting updates.
  student_direct_gradient_max_norm: 0.25
  # Preserve every compatible CFD gradient component, but do not let a measured
  # solver step point uphill on the grounded aircraft-data objective.
  project_conflicting_direct_gradient: true
  weight_decay: 0.0001
  offload_optimizer_state_between_steps: false
  num_epochs: 200
  warmup_steps: 1000
  gradient_clip: 1.0
  ema_decay: 0.999
  disconnection_penalty: 30.0
  clean_geometry_reconstruction_weight: 2.0
  geometry_dice_weight: 1.0
  # High-noise x0 estimates still contribute, but cannot overpower the exact
  # clean-latent geometry anchor before the denoiser has learned that regime.
  minimum_denoising_geometry_confidence: 0.05
  latent_reconstruction_weight: 10.0
  # Cycle over the exact four DDIM inference levels instead of drawing sparse,
  # irreproducible random timesteps.
  timestep_sampling: inference_stratified
  # Generated geometry and measured CFD losses backpropagate through the
  # decoder into denoisers. Decoder parameters are anchored by the exact
  # grounded full-lattice objective in a sequential second backward pass.
  freeze_decoder_for_generated_paths: true
  required_geometry_loss_max: 0.20
  # Promotion uses distinct global seeds and judges intrinsic thresholded
  # outputs; target geometry occupancy is never used to carve predictions.
  promotion_generation_seeds: 6
  promotion_interval_epochs: 1
  stop_on_promotion_pass: true
  overfit_geometry_gate_samples: 16
  overfit_min_generated_aircraft_valid_fraction: 0.50
  overfit_min_generated_unique_fraction: 0.50
  overfit_min_generated_mean_largest_component_fraction: 0.70
  overfit_max_generated_mean_normalization_boundary_fraction: 0.05
  overfit_min_generated_mean_occupied_fraction: 0.0005
  overfit_max_generated_mean_occupied_fraction: 0.25
  promotion_unique_fraction_tolerance: 0.05
  promotion_component_fraction_tolerance: 0.02
  promotion_boundary_fraction_tolerance: 0.01
  promotion_worst_recall_tolerance: 0.01
  promotion_occupancy_error_tolerance: 0.005
  promotion_valid_fraction_tolerance: 0.0
  precision: float32
  save_interval: 25
  val_interval: 1
  coordinate_training_samples: 32768
  coordinate_positive_fraction: 0.5
  direct_solver_loss_weight: 1.0
  direct_solver_interval: 1
  direct_solver_steps: 5
  # 1 base solve + 16 antithetic plus/minus pairs = 33 sequential solves/loss.
  direct_solver_directions: 16
  direct_solver_perturbation: 0.15
  direct_solver_perturbation_grid_size: 12
  # Maximum norm of the measured SPSA voxel gradient. The model-level gradient
  # clip independently bounds the combined neural update after backpropagation.
  direct_solver_gradient_clip: 1.0
  direct_aero_gradient_max_norm: 1.0
  direct_occupancy_gradient_max_norm: 1.0
  direct_connectivity_gradient_max_norm: 1.0
  direct_validity_gradient_max_norm: 1.0
  direct_connectivity_weight: 1.0
  direct_aircraft_validity_weight: 1.0
  # Fixed 0.5 materialization threshold. 0.5 is the natural Bayesian boundary,
  # needs no calibration, keeps the margins (0.5 +/- 0.05) well-defined instead
  # of clamped, and avoids the tail sensitivity that made the old calibrated
  # 0.9752 threshold the root fragility. With calibration disabled the config
  # value is authoritative and overrides any checkpoint/saved threshold.
  geometry_materialization_threshold: 0.5
  calibrate_geometry_materialization_threshold: false
  geometry_threshold_calibration_samples: 16
  threshold_positive_margin: 0.05
  threshold_negative_margin: 0.05
  threshold_positive_margin_weight: 1.0
  threshold_negative_margin_weight: 1.0
  # Deterministic occupancy objective on the free-running field. Replaces the
  # SPSA hard-threshold occupancy component (flip-noise dominated, always at its
  # clip cap) with an analytic gradient of (a) a one-sided mean-probability
  # saturation brake -- pushes down only while mean(p) exceeds the threshold --
  # and (b) a soft threshold-anchored surrogate |mean(sigmoid((p-t)/T)) - ref|
  # anchoring the materialized fraction at the batch reference occupancy
  # (~0.5% sparse airframe). A two-sided mean target at 0.5 would materialize a
  # ~50% filled blob and fight a healthy sparse field; the soft term carries the
  # occupancy anchor instead.
  occupancy_mean_probability_weight: 0.5
  occupancy_soft_temperature: 0.05
  occupancy_soft_weight: 0.5
  require_direct_solver_every_iteration: true

cfd:
  solver: D3Q27
  resolution: 96
  # Solver-integrated optimization consumes raw momentum-exchange coefficients.
  # The legacy calibrated shape correction is not an optimizer input.
  use_shape_drag_correction: false
  # External PDE validation is a separate evidence run. The non-claim-bearing
  # local placeholder is never executed inside the optimizer.
  enable_external_validation: false
  mach_number: 0.3
  reynolds_number: 1000000.0
  simulation_steps: 500
  output_interval: 50
  device_id: 0

report:
  readme_path: ../README.md
  bytes_per_parameter: 4
  optimizer: AdamW
  optimizer_state_tensors_per_parameter: 2
  include_gradient_storage: true

# Experimental conditioning schema for the condition-vector seam.
# The detailed categorical vocabulary and scalar constraint layout now live in
# `conditioning_schema.yaml` so dataset generation, training, and offline
# densification all share the same source of truth.
conditioning:
  schema_path: conditioning_schema.yaml
  vector_dim: 22
  notes:
    - the repo now has a partial structured conditioning path spanning dataset, model, generator, and offline densification
    - public CLI surfaces only a subset of the full schema and still needs condition-response benchmarks before claims can be strengthened
    - scalar constraints include thrust-to-weight, turn-rate, explicit thrust and engine geometry, and numeric min/max bounds

experiment:
  # EXPERIMENTAL (branch experiment/kernel-fusion-launch): route the
  # coordinate-decoder chunk MLP forward through a CUDA-graph capture/replay
  # (CLI/kernel_fusion_graph.py) to cut ~13 launches/chunk to 3. OFF by default:
  # the graph is memory-conditional on 8 GB (~350 MiB static pool) and is only
  # engaged when grad is disabled (torch.utils.checkpoint forward) at a fixed
  # [chunk_size, latent_dim+coordinate_dim] input. Capture failure, shape/device
  # drift, or any autograd-enabled call silently falls back to the compiled or
  # eager path. See docs/performance/experiment-kernel-fusion-launch.md.
  graph_decode_mlp: false
  # EXPERIMENTAL (branch experiment/kernel-fusion-launch): collapse the
  # per-active-guard .item() guard-dot reads at the end of each update into ONE
  # deferred read (all dots computed GPU-side as fp64 tensors, one stacked
  # .tolist() after the loop). Results are bit-identical to the per-guard path
  # (same fp64 torch.dot over the same flattened concatenations, same order);
  # only the GPU->CPU sync count changes. ON 2026-08-16 after parity re-verify
  # on HEAD (guard_dot_parity_check*.py: bit-identical per guard).
  batch_guard_dot_reads: true
  # EXPERIMENTAL (branch experiment/kernel-fusion-launch): enqueue all 33
  # sequential SPSA solves with NO host scalar reads, then read every probe's
  # occupancy / coefficient / nonempty scalars back in ONE batched
  # torch.stack(...).tolist() + one sync (occupancy and the coefficient
  # arithmetic are bit-identical to the per-solve read path). ON 2026-08-16
  # after parity re-verify on HEAD (deferred_solver_reads_parity.py: ALL PASS,
  # full SPSA forward OFF-vs-ON byte-identical loss/grads/components).
  deferred_solver_reads: true
  # NUMERICS (branch experiment/kernel-fusion-launch): run the neural-network
  # GEMMs (coordinate decoder + diffusion encoder/attention) on TF32 tensor-core
  # math. The D3Q27 LBM/SPSA solver path is elementwise-only (no matmul/einsum),
  # so this CANNOT change the solver's arithmetic -- only NN GEMM precision.
  # Measured 2026-08-17 (build/perf/baseline/tf32_probe.py / tf32_profile.py):
  # gradients stay within GRAD_ATOL (0.2-0.4x), output field drifts ~2e-4 rel
  # (49x the 4e-6 refactor-parity gate, benign at the geometry level), and
  # steady-state drops ~44 -> ~31-34 s/u (mean 36.2 vs 49.3). fp32 STORAGE is
  # unchanged; only GEMM math moves to TF32. ON 2026-08-17 by explicit user
  # decision; the claim-bearing run's paper must document this precision mode.
  tf32_gemm_math: true

design:
  target_speed: 50.0
  wingspan_limit_m: 1.8
  thrust_to_weight_min: 0.45
  turn_rate_min_deg_s: 18.0
  required_static_thrust_n: 180.0
  engine_diameter_mm: 140
  engine_length_mm: 260
  engine_count_min: 1
  engine_count_max: 2
  payload_mass_min_g: 500
  payload_mass_max_g: 2000
  takeoff_distance_min_m: 120
  takeoff_distance_max_m: 250
  wall_thickness_min_mm: 1
  wall_thickness_max_mm: 2
  part_count_min: 1
  part_count_max: 8
  manufacturing_method: fdm_pla_0p4mm
  space_weight: 0.33
  drag_weight: 0.33
  lift_weight: 0.34
  bounding_box: [64, 64, 64]

