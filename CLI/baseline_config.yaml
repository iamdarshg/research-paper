baseline_name: minimal_grounded_aircraft
baseline_set:
  - retrieval
  - unconditional_checkpoint
  - bundled_grounded_stl
description: >
  Minimal grounded baseline policy for final-run guardrails. The checked-in
  protocol uses generated deterministic reference records for retrieval and
  unconditional-checkpoint baselines, plus the repository's bundled aircraft-like
  STL files for bundled-grounded-STL smoke comparisons.
stl_paths:
  - ../biplane.stl
  - ../F-18_Hornet.stl
evaluation:
  solver: D3Q27
  grid_size: 32
  steps: 200
notes:
  - Replace or extend these paths with a larger grounded corpus before making paper-level claims.
  - The current config is suitable for guardrail plumbing and deterministic reference evidence, not publication-grade benchmarking.
