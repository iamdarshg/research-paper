baseline_name: claim_bearing_guardrail_baselines
baseline_set:
  - retrieval
  - unconditional_checkpoint
  - bundled_grounded_stl
baselines:
  retrieval:
    description: >
      Nearest-record retrieval from the grounded manifest under the same
      condition schema. A passing baseline report must include concrete
      retrieval outputs before this family can support claims.
  unconditional_checkpoint:
    description: >
      Samples from the same architecture without structured conditioning.
      A passing baseline report must include checkpoint-derived outputs before
      this family can support claims.
  bundled_grounded_stl:
    description: >
      Repository-bundled grounded STL references evaluated under the same solver
      settings as generated candidates.
description: >
  Claim-bearing guardrail baseline families required by the final evidence
  package. This config names the required comparison families; the corresponding
  baseline report still has to contain concrete outputs for every family.
stl_paths:
  - ../biplane.stl
  - ../F-18_Hornet.stl
evaluation:
  solver: D3Q27
  grid_size: 32
  steps: 200
notes:
  - Replace or extend these paths with a larger grounded corpus before making paper-level claims.
  - The current config is suitable for final-run guardrail plumbing, not by itself publication-grade benchmarking.
